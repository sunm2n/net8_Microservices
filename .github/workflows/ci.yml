# CI — 테스트 → 정적분석 → 빌드 → 푸시 → 스캔 확인 → 매니페스트 갱신
#
# 이 파일은 얇은 래퍼다. 실제 로직은 scripts/ci-*.sh 에 있다.
# 이 PoC 의 최종 목적지는 GitLab + Jenkins 이고, 그때 이 파일만 갈아끼우면 된다.
#
# 배포는 여기서 하지 않는다. 매니페스트 저장소의 이미지 태그를 바꿔 커밋하면
# ArgoCD 가 감지해 클러스터에 반영한다.
#
# 단계 순서는 "싼 검사를 먼저"다.
# 테스트는 수십 ms, 이미지 빌드는 수 분이다. 테스트가 깨지면 빌드하지 않는다.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 같은 브랜치에서 여러 실행이 겹치면 매니페스트 저장소에 경쟁적으로 커밋하게 된다.
# 나중 것만 남기고 진행 중인 것은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub 호스티드 러너는 인터넷 밖에 있어 로컬 Harbor 와 kind 클러스터에 닿지 않는다.
    runs-on: [self-hosted, erp-poc]

    env:
      # Homebrew 로 설치한 도구(gh, java 등)를 러너 환경에서 찾게 한다.
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        # 커밋 해시를 태그로 쓴다.
        # 고정 태그를 덮어쓰면 무엇이 배포됐는지 알 수 없고,
        # imagePullPolicy: IfNotPresent 와 겹치면 노드가 옛 이미지를 계속 쓴다.
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # ── 품질 게이트 ─────────────────────────────────────────────
      # 이미지를 만들기 전에 돌린다. 실패하면 아무것도 푸시되지 않는다.

      - name: 단위 테스트
        id: test
        run: scripts/ci-test.sh

      - name: 정적분석
        env:
          # 없으면 분석을 건너뛴다. 로컬 클러스터에만 있는 서버라
          # 다른 환경에서 파이프라인을 세우지 않기 위해서다.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: scripts/ci-analyze.sh "${{ steps.meta.outputs.tag }}"

      # ── 빌드·푸시 ───────────────────────────────────────────────

      - name: 이미지 빌드
        run: scripts/ci-build.sh "${{ steps.meta.outputs.tag }}"

      - name: Harbor 푸시
        run: scripts/ci-push.sh "${{ steps.meta.outputs.tag }}"

      # ── 보안 게이트 ─────────────────────────────────────────────
      # Harbor 는 pull 시점에도 차단하지만 그때는 이미 배포가 시작된 뒤다.
      # 판정을 배포 전으로 당긴다.

      - name: 취약점 스캔 확인
        run: scripts/ci-scan.sh "${{ steps.meta.outputs.tag }}"

      # ── 배포 ────────────────────────────────────────────────────

      - name: 매니페스트 갱신
        env:
          # 없으면 러너 머신의 gh 인증을 쓴다.
          # 운영에서는 이 시크릿을 반드시 주입해야 한다 — scripts/ci-deploy.sh 참고.
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: scripts/ci-deploy.sh "${{ steps.meta.outputs.tag }}"

      - name: 요약
        if: always()
        run: |
          {
            echo "### 배포 태그 \`${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| 단위 테스트 | ${{ steps.test.outputs.passed || '-' }} / ${{ steps.test.outputs.total || '-' }} 통과 |"
            echo "| 정적분석 | SonarQube 품질 게이트 |"
            echo "| 이미지 빌드 | 6개 |"
            echo "| Harbor 푸시 | \`harbor.localtest.me/erp-hq\` |"
            echo "| 취약점 스캔 | 허용목록 밖 Critical 없음 |"
            echo "| 매니페스트 | \`Kubernetes_devOps_Poc@dev\` |"
            echo ""
            echo "ArgoCD 가 폴링 주기(60초) 안에 감지해 배포한다."
          } >> "$GITHUB_STEP_SUMMARY"
